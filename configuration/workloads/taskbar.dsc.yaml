# Taskbar, Start and search (from microsoft/WindowsDeveloperConfig's registry-taskbar-search
# step; its Do Not Disturb and Bluetooth-icon tweaks are left out).
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  # "End task" on taskbar right-click. Windows 11 23H2+ only.
  - name: taskbarEndTask
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced\TaskbarDeveloperSettings
      valueName: TaskbarEndTask
      valueData: { DWord: 1 }

  # No web results in Start/search.
  - name: searchNoWebSuggestions
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Policies\Microsoft\Windows\Explorer
      valueName: DisableSearchBoxSuggestions
      valueData: { DWord: 1 }

  # No "search highlights" (daily trivia and trending searches in the search box).
  - name: searchNoHighlights
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\SearchSettings
      valueName: IsDynamicSearchBoxEnabled
      valueData: { DWord: 0 }

  # No recommendations in Start. Windows 11 only.
  - name: startNoRecommendations
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      valueName: Start_IrisRecommendations
      valueData: { DWord: 0 }

  # No widgets. This policy is Windows 11's; Windows 10's "News and interests" taskbar feed is
  # the next one.
  - name: noWidgets
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\SOFTWARE\Policies\Microsoft\Dsh
      valueName: AllowNewsAndInterests
      valueData: { DWord: 0 }

  - name: noNewsAndInterests
    type: Microsoft.Windows/Registry
    properties:
      keyPath: HKLM\SOFTWARE\Policies\Microsoft\Windows\Windows Feeds
      valueName: EnableFeeds
      valueData: { DWord: 0 }
