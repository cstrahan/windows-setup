# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# Declarative Windows configuration, applied with:
#   winget configure --file configuration\windows.dsc.yaml --module-path %CD%\dsc
#   (--module-path must be absolute; run from the repo root.)
# `winget configure test ...` (same arguments) reports drift without changing anything.
properties:
  configurationVersion: 0.2.0
  resources:
    # Ships with Windows 10 1809+, but it's an optional capability that can be missing.
    # WindowsSetupDsc is this repo's own module (dsc/), not ComputerManagementDsc: the DISM
    # cmdlets fail natively inside winget's PowerShell 7 host on Windows 10.
    - resource: WindowsSetupDsc/WindowsCapability
      id: openSshClient
      directives:
        description: Install the OpenSSH client (ssh, ssh-agent, ssh-add)
        securityContext: elevated
        allowPrerelease: false
      settings:
        Name: OpenSSH.Client~~~~0.0.1.0
        Ensure: Present

    # The OpenSSH agent is disabled by default.
    - resource: PSDscResources/Service
      id: sshAgent
      dependsOn:
        - openSshClient
      directives:
        description: Start the OpenSSH agent automatically, and now
        securityContext: elevated
        allowPrerelease: false
      settings:
        Name: ssh-agent
        StartupType: Automatic
        State: Running
        Ensure: Present

    # Keep the hardware clock (RTC) in UTC, like Linux does, so dual-booting doesn't skew the clock.
    # Windows reads this at boot, so it takes effect after a reboot.
    - resource: PSDscResources/Registry
      id: rtcIsUniversal
      directives:
        description: Treat the hardware clock (RTC) as UTC
        securityContext: elevated
        allowPrerelease: false
      settings:
        Key: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\TimeZoneInformation
        ValueName: RealTimeIsUniversal
        ValueType: QWord
        ValueData: "1"
        Ensure: Present
        Force: true

    # Windows only polls its time server every several hours (SpecialPollInterval) and doesn't
    # resync on wake, so after sleep, hibernation or Fast Startup the clock can stay wrong for
    # hours. Keep the time service running, and resync whenever the network connects or the
    # machine resumes.
    - resource: PSDscResources/Service
      id: timeService
      directives:
        description: 'Time: keep the Windows Time service running'
        securityContext: elevated
        allowPrerelease: false
      settings:
        Name: W32Time
        StartupType: Automatic  # non-domain Windows 10 defaults to a trigger start
        State: Running
        Ensure: Present

    - resource: ComputerManagementDsc/ScheduledTask
      id: timeResyncTask
      dependsOn:
        - timeService
      directives:
        description: 'Time: resync when the network connects or the machine resumes'
        securityContext: elevated
        allowPrerelease: false
      settings:
        TaskPath: \windows-setup\
        TaskName: Resync time
        Description: Resync the clock (w32tm /resync) when a network connects or the machine resumes from sleep. Managed by windows-setup.
        ActionExecutable: '%SystemRoot%\System32\w32tm.exe'
        ActionArguments: /resync
        ScheduleType: OnEvent
        # NetworkProfile 10000 = network connected; Power-Troubleshooter 1 = resumed from sleep.
        EventSubscription: >-
          <QueryList><Query Id="0" Path="Microsoft-Windows-NetworkProfile/Operational">
          <Select Path="Microsoft-Windows-NetworkProfile/Operational">*[System[Provider[@Name='Microsoft-Windows-NetworkProfile'] and EventID=10000]]</Select>
          <Select Path="System">*[System[Provider[@Name='Microsoft-Windows-Power-Troubleshooter'] and EventID=1]]</Select>
          </Query></QueryList>
        Delay: '00:00:15'  # give DNS a moment after the network comes up
        BuiltInAccount: SYSTEM
        MultipleInstances: IgnoreNew
        ExecutionTimeLimit: '00:05:00'
        # Task Scheduler's defaults skip tasks on battery, which would defeat this on laptops.
        AllowStartIfOnBatteries: true
        DontStopIfGoingOnBatteries: true
        Enable: true
        Ensure: Present

    # Explorer > Folder Options, per user (HKCU): only settings that differ from the Windows 10
    # defaults. Explorer picks them up in new windows after restarting it (or signing out).
    - resource: PSDscResources/Registry
      id: explorerShowHiddenFiles
      directives:
        description: 'Folder Options: Show hidden files, folders, and drives'
        allowPrerelease: false
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: Hidden
        ValueType: DWord
        ValueData: "1"  # default 2: don't show
        Ensure: Present
        Force: true

    - resource: PSDscResources/Registry
      id: explorerShowFileExtensions
      directives:
        description: 'Folder Options: uncheck "Hide extensions for known file types"'
        allowPrerelease: false
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: HideFileExt
        ValueType: DWord
        ValueData: "0"  # default 1
        Ensure: Present
        Force: true

    - resource: PSDscResources/Registry
      id: explorerShowEmptyDrives
      directives:
        description: 'Folder Options: uncheck "Hide empty drives"'
        allowPrerelease: false
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
        ValueName: HideDrivesWithNoMedia
        ValueType: DWord
        ValueData: "0"  # default 1
        Ensure: Present
        Force: true

    - resource: PSDscResources/Registry
      id: explorerFullPathInTitleBar
      directives:
        description: 'Folder Options: check "Display the full path in the title bar"'
        allowPrerelease: false
      settings:
        Key: HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Explorer\CabinetState
        ValueName: FullPath
        ValueType: DWord
        ValueData: "1"  # default 0
        Ensure: Present
        Force: true

    # Keyboard repeat (Control Panel > Keyboard): applied immediately and saved.
    - resource: WindowsSetupDsc/KeyboardRepeat
      id: keyboardRepeat
      directives:
        description: 'Keyboard: shortest repeat delay, fastest repeat rate'
        allowPrerelease: false
      settings:
        IsSingleInstance: "Yes"  # quoted: YAML would otherwise read it as a boolean
        RepeatDelay: 0  # default 1
        RepeatRate: 31  # the default, and the fastest

    # Caps Lock acts as an extra Left Ctrl, on every keyboard. Windows' Scancode Map can't be
    # per-keyboard, and takes effect after a restart. Format: 8-byte header, entry count 2 (one
    # mapping + terminator), 1D00 3A00 = Left Ctrl (0x1D) replacing Caps Lock (0x3A), terminator.
    - resource: PSDscResources/Registry
      id: capsLockAsCtrl
      directives:
        description: 'Keyboard: Caps Lock acts as Left Ctrl (after a restart)'
        securityContext: elevated
        allowPrerelease: false
      settings:
        Key: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Keyboard Layout
        ValueName: Scancode Map
        ValueType: Binary
        ValueData: "0000000000000000020000001d003a0000000000"
        Ensure: Present
        Force: true

    # uv, the Python package and project manager. (PowerShell 7 isn't here: bootstrap.ps1
    # installs and updates it, since configure.ps1 runs in it.)
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: uv
      directives:
        description: Install uv
        allowPrerelease: false
      settings:
        Id: astral-sh.uv
        Source: winget
        UseLatest: true

    # VS Code updates itself, so only its presence is managed.
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives:
        description: Install Visual Studio Code
        allowPrerelease: false
      settings:
        Id: Microsoft.VisualStudioCode
        Source: winget

    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: windowsTerminal
      directives:
        description: Install Windows Terminal
        allowPrerelease: false
      settings:
        Id: Microsoft.WindowsTerminal
        Source: winget

    # From go.dev rather than winget's GoLang.Go, which can trail upstream releases by days.
    - resource: WindowsSetupDsc/GoLang
      id: go
      directives:
        description: Install the latest stable Go from go.dev
        securityContext: elevated
        allowPrerelease: false
      settings:
        IsSingleInstance: "Yes"  # quoted: YAML would otherwise read it as a boolean
        UseLatest: true
        MinimumVersion: 1.27.1

    # The installer only offers some choices when their targets exist: EditorOption needs VS Code,
    # the windowsterminal component needs Windows Terminal, and ExternalOpenSSH makes Git use
    # Windows' OpenSSH (and so the ssh-agent service) instead of its bundled copy.
    - resource: WindowsSetupDsc/GitForWindows
      id: git
      dependsOn:
        - vscode
        - windowsTerminal
        - openSshClient
      directives:
        description: Install Git for Windows with these installer choices
        securityContext: elevated
        allowPrerelease: false
      settings:
        Id: Git.Git
        UseLatest: true
        Components:
          - ext\shellhere      # Explorer: "Open Git Bash here"
          - ext\guihere        # Explorer: "Open Git GUI here"
          - gitlfs
          - assoc              # .gitconfig, .gitattributes, ... open in the editor
          - assoc_sh           # .sh files run with Bash
          - windowsterminal    # Git Bash profile in Windows Terminal
        EditorOption: VisualStudioCode
        DefaultBranchOption: main
        PathOption: Cmd
        SSHOption: ExternalOpenSSH
        CURLOption: WinSSL
        CRLFOption: CRLFAlways
        BashTerminalOption: MinTTY
        GitPullBehaviorOption: Merge
        UseCredentialManager: Enabled
        PerformanceTweaksFSCache: Enabled
        EnableSymlinks: Enabled
        EnableFSMonitor: Disabled
