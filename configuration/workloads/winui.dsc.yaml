# WinUI 3 / Windows App SDK development (from microsoft/WindowsDeveloperConfig's winui workload,
# which mirrors https://learn.microsoft.com/windows/apps/get-started/start-here). Requires the
# dotnet and visualstudio workloads, and system (Developer Mode).
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  - name: winuiComponents
    type: WindowsSetup.VisualStudioComponents/VisualStudioComponents
    properties:
      Name: winui
      Components:
        - Microsoft.VisualStudio.Workload.ManagedDesktop
        - Microsoft.VisualStudio.Workload.Universal
        # Windows App SDK C# templates. (WindowsDeveloperConfig's Microsoft.VisualStudio.ComponentGroup.WindowsAppSDK.Cs
        # isn't in VS 2026's catalog; the installer silently ignores unknown IDs.)
        - Microsoft.VisualStudio.Component.WindowsAppSdkSupport.CSharp
      IncludeRecommended: false

  # The Windows App SDK command line tool (winapp).
  - name: winAppCli
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.WinAppCli  # sic; WindowsDeveloperConfig's Microsoft.WinAppCLI doesn't match exactly
      source: winget
      acceptAgreements: true

  - name: windowsAppRuntime
    type: Microsoft.WinGet/Package
    properties:
      id: Microsoft.WindowsAppRuntime.1.6
      source: winget
      acceptAgreements: true
