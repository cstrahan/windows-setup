# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
#
# System76 Gazelle (gaze16). Applied by configure.py when configuration\hardware.toml matches.
properties:
  configurationVersion: 0.2.0
  resources:
    # The ELAN0412 precision touchpad has dedicated left/right buttons, so turn off tapping,
    # which is easy to trigger by accident. On Windows 10 this takes effect at the next sign-in.
    - resource: WindowsSetupDsc/PrecisionTouchpad
      id: touchpadNoTaps
      directives:
        description: 'Touchpad: turn off tap to click, two-finger tap to right-click, and tap-and-drag'
        allowPrerelease: false
      settings:
        IsSingleInstance: "Yes"  # quoted: YAML would otherwise read it as a boolean
        Taps: Disabled
        TwoFingerTap: Disabled
        TapAndDrag: Disabled
